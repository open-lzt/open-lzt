# Shared response headers for every /get/*.sh route.
#
# In one file because `add_header` in a location discards the server-level set:
# repeating them per route by hand is how one of them silently goes missing.

# default_type alone: adding a Content-Type header on top sent it twice.
default_type "text/x-shellscript; charset=utf-8";
add_header X-Content-Type-Options "nosniff" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

# Short cache: an installer fix should reach people in minutes, and this file is
# a few kilobytes — there is nothing to save by caching it for a day.
add_header Cache-Control "public, max-age=300" always;

# It is a script to run, not a page to render.
add_header Content-Disposition "inline" always;
